<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#eef1e9"/>

  <!-- Screen/Monitor -->
  <rect x="50" y="60" width="140" height="110" rx="8" fill="none" stroke="#245552" stroke-width="2"/>
  <rect x="50" y="60" width="140" height="95" rx="5" fill="#f0f0f0"/>

  <!-- Person on screen (therapist) -->
  <circle cx="105" cy="85" r="12" fill="none" stroke="#245552" stroke-width="1.5"/>
  <rect x="100" y="97" width="10" height="25" fill="none" stroke="#245552" stroke-width="1.5"/>
  <line x1="100" y1="105" x2="85" y2="120" stroke="#245552" stroke-width="1.5"/>
  <line x1="110" y1="105" x2="125" y2="120" stroke="#245552" stroke-width="1.5"/>

  <!-- Screen stand -->
  <rect x="85" y="170" width="40" height="8" fill="#245552"/>
  <line x1="95" y1="178" x2="90" y2="195" stroke="#245552" stroke-width="2"/>
  <line x1="115" y1="178" x2="120" y2="195" stroke="#245552" stroke-width="2"/>

  <!-- Person at home (patient) -->
  <circle cx="290" cy="95" r="15" fill="none" stroke="#245552" stroke-width="2"/>
  <rect x="283" y="110" width="14" height="35" fill="none" stroke="#245552" stroke-width="2" rx="2"/>
  <line x1="283" y1="125" x2="260" y2="145" stroke="#245552" stroke-width="2"/>
  <line x1="297" y1="125" x2="320" y2="145" stroke="#245552" stroke-width="2"/>
  <line x1="288" y1="145" x2="280" y2="190" stroke="#245552" stroke-width="2"/>
  <line x1="296" y1="145" x2="305" y2="190" stroke="#245552" stroke-width="2"/>

  <!-- Connection line -->
  <line x1="195" y1="115" x2="275" y2="115" stroke="#768b6e" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="235" cy="115" r="4" fill="#768b6e"/>

  <!-- Text -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#245552">Online Physiotherapy</text>
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#606b66">Video Sessions From Home</text>
</svg>