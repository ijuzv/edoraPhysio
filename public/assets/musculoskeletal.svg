<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#eef1e9"/>

  <!-- Body outline -->
  <circle cx="200" cy="60" r="25" fill="none" stroke="#245552" stroke-width="2"/>

  <!-- Torso -->
  <rect x="190" y="85" width="20" height="50" fill="none" stroke="#245552" stroke-width="2" rx="3"/>

  <!-- Arms -->
  <line x1="190" y1="100" x2="140" y2="120" stroke="#245552" stroke-width="2"/>
  <line x1="210" y1="100" x2="260" y2="120" stroke="#245552" stroke-width="2"/>

  <!-- Legs -->
  <line x1="195" y1="135" x2="185" y2="200" stroke="#245552" stroke-width="2"/>
  <line x1="205" y1="135" x2="215" y2="200" stroke="#245552" stroke-width="2"/>

  <!-- Joint highlights (spine) -->
  <circle cx="200" cy="95" r="6" fill="#768b6e" opacity="0.7"/>
  <circle cx="200" cy="110" r="6" fill="#768b6e" opacity="0.7"/>
  <circle cx="200" cy="125" r="6" fill="#768b6e" opacity="0.7"/>

  <!-- Knee joints -->
  <circle cx="185" cy="170" r="5" fill="#768b6e" opacity="0.7"/>
  <circle cx="215" cy="170" r="5" fill="#768b6e" opacity="0.7"/>

  <!-- Text -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#245552">Musculoskeletal Care</text>
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#606b66">Joint & Spine Assessment</text>
</svg>