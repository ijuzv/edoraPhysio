<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#eef1e9"/>

  <!-- Person standing -->
  <circle cx="140" cy="60" r="20" fill="none" stroke="#245552" stroke-width="2"/>
  <rect x="130" y="80" width="20" height="45" fill="none" stroke="#245552" stroke-width="2" rx="2"/>
  <line x1="130" y1="95" x2="100" y2="120" stroke="#245552" stroke-width="2"/>
  <line x1="150" y1="95" x2="180" y2="120" stroke="#245552" stroke-width="2"/>
  <line x1="135" y1="125" x2="125" y2="170" stroke="#245552" stroke-width="2"/>
  <line x1="145" y1="125" x2="155" y2="170" stroke="#245552" stroke-width="2"/>

  <!-- Arrow showing recovery progression -->
  <path d="M 200 100 Q 280 80 320 120" fill="none" stroke="#768b6e" stroke-width="3"/>
  <polygon points="320,120 310,105 315,125" fill="#768b6e"/>

  <!-- Progress circles -->
  <circle cx="200" cy="100" r="8" fill="#768b6e"/>
  <circle cx="240" cy="85" r="8" fill="#768b6e" opacity="0.5"/>
  <circle cx="280" cy="90" r="8" fill="#768b6e" opacity="0.3"/>

  <!-- Recovery lines -->
  <line x1="200" y1="110" x2="200" y2="140" stroke="#d8dfd7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Text -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#245552">Injury & Sports Rehabilitation</text>
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#606b66">Progressive Recovery Path</text>
</svg>