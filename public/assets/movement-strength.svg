<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#eef1e9"/>

  <!-- Person in dynamic pose -->
  <circle cx="200" cy="55" r="20" fill="none" stroke="#245552" stroke-width="2"/>

  <!-- Torso angled -->
  <rect x="192" y="75" width="16" height="45" fill="none" stroke="#245552" stroke-width="2" rx="2" transform="rotate(-15 200 75)"/>

  <!-- Arms raised in strength pose -->
  <line x1="192" y1="90" x2="130" y2="70" stroke="#245552" stroke-width="2" stroke-linecap="round"/>
  <line x1="208" y1="90" x2="270" y2="70" stroke="#245552" stroke-width="2" stroke-linecap="round"/>

  <!-- Forearms -->
  <line x1="130" y1="70" x2="120" y2="40" stroke="#245552" stroke-width="2" stroke-linecap="round"/>
  <line x1="270" y1="70" x2="280" y2="40" stroke="#245552" stroke-width="2" stroke-linecap="round"/>

  <!-- Legs in stable stance -->
  <line x1="195" y1="120" x2="175" y2="180" stroke="#245552" stroke-width="2"/>
  <line x1="205" y1="120" x2="225" y2="180" stroke="#245552" stroke-width="2"/>

  <!-- Strength indicators (energy waves) -->
  <circle cx="200" cy="150" r="25" fill="none" stroke="#768b6e" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="150" r="40" fill="none" stroke="#768b6e" stroke-width="1.5" opacity="0.4"/>

  <!-- Text -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#245552">Movement & Strength</text>
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#606b66">Personalized Exercise Programs</text>
</svg>